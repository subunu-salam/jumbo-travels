services:
  - type: web
    name: jumbo-travels
    runtime: node
    plan: starter            # persistent disks need a paid plan
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: jumbo-data
      mountPath: /var/data
      sizeGB: 1
