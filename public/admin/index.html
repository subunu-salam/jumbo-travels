<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Jumbo Travel — Admin</title>
<link rel="icon" href="/img/favicon.png"><link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<section class="login hidden" id="login">
  <form id="login-form">
    <img src="/img/favicon.png" alt="">
    <h1>Admin portal</h1><p>Sign in to manage packages, deals and website content.</p>
    <div style="display:grid;gap:14px">
      <div><label for="u">Username</label><input type="text" id="u" autocomplete="username" required></div>
      <div><label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="justify-content:center">Sign in</button>
    </div>
    <div class="err-msg" id="login-err"></div>
  </form>
</section>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"/><circle cx="32" cy="34" r="16" fill="none" stroke="#fff" stroke-width="3"/><ellipse cx="32" cy="34" rx="7" ry="16" fill="none" stroke="#1cade3" stroke-width="2.5"/><path d="M8 36C18 10 50 8 56 24" fill="none" stroke="#ee1579" stroke-width="3.5" stroke-linecap="round"/></svg><div>Jumbo Travel<small>Content admin</small></div></div>
    <div class="sec">Manage</div><nav id="side-nav"></nav>
    <div class="spacer"></div><div class="help"><b>✨ AI writer</b>Open any package and tap “Write with AI” to draft its copy.</div>
    <a class="view" href="/" target="_blank"><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="currentColor"/></svg>View website</a>
    <button id="logout"><svg viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5zm6.6 4.4L15.2 8.8 17.4 11H9v2h8.4l-2.2 2.2 1.4 1.4L21.2 12z" fill="currentColor"/></svg>Sign out</button>
  </aside>
  <div>
    <nav class="mobile-nav" id="mobile-nav"></nav>
    <main class="main" id="view"></main>
  </div>
</div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
<div class="toast" id="toast"></div>
<script src="/admin/admin.js"></script>
</body></html>
